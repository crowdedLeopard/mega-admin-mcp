name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Start server (AUTH_MODE=none) and smoke test the MCP endpoint
        env:
          AUTH_MODE: none
          CATALOG_AUTO_REFRESH: "false"
          PORT: "8000"
        run: |
          python -m megamcp.app &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/ready
          python scripts/smoke_test.py --url http://127.0.0.1:8000/mcp
      - name: Bicep compiles
        if: matrix.python == '3.13'
        run: |
          curl -sLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64 && chmod +x bicep
          ./bicep build deploy/bicep/main.bicep --outfile /tmp/azuredeploy.json
          diff <(python -c "import json;print(sorted(json.load(open('/tmp/azuredeploy.json'))['parameters']))") <(python -c "import json;print(sorted(json.load(open('deploy/azuredeploy.json'))['parameters']))") || echo "::warning::deploy/azuredeploy.json is out of date with main.bicep"

  container:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (GHCR needs lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
