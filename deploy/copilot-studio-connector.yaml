# Custom connector definition for Copilot Studio (Option 2 in the Copilot Studio docs: import an OpenAPI file in Power Apps).
# Most people should use the MCP onboarding wizard instead; it generates this for you. Keep this file for environments where
# makers must import a reviewed connector definition, or for solution-aware connectors you promote between environments.
#
# Replace <app-name>, <tenant-id> and <client-id>. The live server also serves a filled-in copy at https://<app-name>.azurewebsites.net/connector.yaml
swagger: '2.0'
info:
  title: Mega Admin MCP
  description: Any Microsoft admin REST call as the signed-in administrator, with FinOps and AI tokenomics built in. Self-updating, self-healing.
  version: '1.0.0'
host: <app-name>.azurewebsites.net
basePath: /
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /mcp:
    post:
      summary: Mega Admin MCP server
      x-ms-agentic-protocol: mcp-streamable-1.0
      operationId: InvokeMCP
      responses:
        '200':
          description: Success
securityDefinitions:
  oauth2-auth:
    type: oauth2
    flow: accessCode
    authorizationUrl: https://login.microsoftonline.com/<tenant-id>/oauth2/v2.0/authorize
    tokenUrl: https://login.microsoftonline.com/<tenant-id>/oauth2/v2.0/token
    scopes:
      <client-id>/.default: Access Mega Admin MCP as the signed-in admin (GUID form; Entra rejects api:// when an app requests a token for itself, AADSTS90009)
security:
  - oauth2-auth:
      - <client-id>/.default
