[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mega-admin-mcp"
version = "1.2.2"
description = "Mega Admin MCP: one self-updating, self-healing MCP server that lets Copilot Studio agents run any Microsoft admin REST call, with FinOps and AI tokenomics built in."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chris Mathias" }]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "msal>=1.31",
  "azure-identity>=1.19",
  "PyJWT[crypto]>=2.9",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
build = ["pyyaml>=6.0.2"]
dev = ["pytest>=8", "pyyaml>=6.0.2"]

[project.scripts]
megamcp = "megamcp.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
megamcp = ["data/*.gz", "data/*.json", "data/curated/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
